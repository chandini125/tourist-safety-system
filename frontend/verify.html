<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital ID Verification</title>

    <link rel="stylesheet" href="verify.css">
</head>

<body>

    <div class="verify-container">

        <h1>Digital Tourist ID Verification</h1>

        <p>Authority Verification Portal</p>

        <div class="verify-card">

            <label for="digitalId">
                Enter Digital ID
            </label>

            <input
                type="text"
                id="digitalId"
                placeholder="Example: ST-000003"
            >

            <button id="verifyBtn">
                Verify Digital ID
            </button>

            <div id="result"></div>

        </div>

    </div>

    <script src="verify.js"></script>

</body>

</html>
